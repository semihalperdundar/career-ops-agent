name: Hourly Job Scraper

on:
  schedule:
    - cron: '0 * * * *' # Her saat başı tam saatte çalışır
  workflow_dispatch: # GitHub arayüzünden manuel tetiklemene olanak tanır

jobs:
  scrape-and-evaluate:
    runs-on: ubuntu-latest

    permissions:
      contents: write # data/*.tsv geri push edebilmek için zorunlu

    concurrency:
      group: hourly-scraper # üst üste binen run'lar state'i ezmesin
      cancel-in-progress: false

    steps:
    - name: Repo'yu Klonla
      uses: actions/checkout@v4
      with:
        persist-credentials: true # GITHUB_TOKEN'i push için remote'a yaz
        fetch-depth: 0

    - name: Python Kurulumu
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Bağımlılıkları Yükle
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        playwright install --with-deps chromium

    - name: Scraper'ı Çalıştır
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        PREMIUM_PROXY_URL: ${{ secrets.PREMIUM_PROXY_URL }}
      run: |
        python telegram-daily.py

    - name: Durumu Repoya Yaz (dedup state)
      if: always() # scraper kısmi hata alsa da gönderilenler kaydedilsin
      run: |
        git config user.name  "career-ops-bot"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add data/telegram-sent.tsv data/telegram-archive.tsv data/scraper-state.json
        # Değişiklik yoksa sessizce çık (workflow'u kırmadan)
        git diff --staged --quiet && echo "state değişmedi" && exit 0
        git commit -m "chore(state): telegram arşivi + tarama durumu güncellendi [skip ci]"
        # Paralel/geciken run'larla çarpışmayı önle: rebase edip tekrar dene
        for i in 1 2 3; do
          git pull --rebase --autostash origin ${{ github.ref_name }} && \
          git push origin HEAD:${{ github.ref_name }} && exit 0
          sleep $((RANDOM % 10 + 5))
        done
        echo "::error::state push başarısız — sonraki run duplicate gönderebilir"
        exit 1
